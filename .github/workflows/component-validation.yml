name: Component validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  detect:
    runs-on: windows-latest
    outputs:
      components: ${{ steps.changed.outputs.components }}
      has_components: ${{ steps.changed.outputs.has_components }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/cache@v6
        with:
          path: .cache/saarelai
          key: josm-core-19646-c99bface5780e219d312a86e6e9edc63c32c0ba0e811f13b228c709f4f8b7b45

      - id: changed
        name: Find affected components
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:EVENT_NAME -eq "pull_request") {
              $base = $env:PULL_REQUEST_BASE
          } else {
              $base = $env:PUSH_BEFORE
          }
          $components = & python scripts/deploy.py changed-components `
              --base-sha $base `
              --head-sha $env:HEAD_SHA `
              --event $env:EVENT_NAME
          if ($LASTEXITCODE -ne 0) {
              throw "Changed-component detection failed."
          }
          $componentList = ConvertFrom-Json -InputObject ($components -join "") -NoEnumerate
          if ($componentList.Count -eq 1 -and $componentList[0] -eq "__none__") {
              "has_components=false" >> $env:GITHUB_OUTPUT
              "components=[]" >> $env:GITHUB_OUTPUT
          } else {
              "has_components=true" >> $env:GITHUB_OUTPUT
              "components=$($components -join '')" >> $env:GITHUB_OUTPUT
          }

  release_utility_tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Test release utilities
        shell: pwsh
        run: python -m unittest discover -s scripts/tests -v

  validate:
    needs:
      - detect
      - release_utility_tests
    runs-on: windows-latest
    if: ${{ needs.detect.outputs.has_components == 'true' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        component: ${{ fromJSON(needs.detect.outputs.components) }}
    env:
      SAARELAI_CACHE_DIR: ${{ github.workspace }}\.cache\saarelai
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v6
        if: ${{ startsWith(matrix.component, 'plugins/') }}
        with:
          distribution: zulu
          java-version: "21"

      - name: Build selected plugin
        if: ${{ startsWith(matrix.component, 'plugins/') }}
        shell: pwsh
        run: .\scripts\Invoke-ComponentBuild.ps1 -Component $env:COMPONENT
        env:
          COMPONENT: ${{ matrix.component }}

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "25"

      - name: Validate selected component with target JOSM runtime
        shell: pwsh
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          $ErrorActionPreference = "Stop"
          python scripts/deploy.py validate --component $env:COMPONENT
          if ($LASTEXITCODE -ne 0) {
              throw "Component validation failed for $env:COMPONENT."
          }

  validation-gate:
    name: Component validation gate
    needs:
      - detect
      - release_utility_tests
      - validate
    if: ${{ always() }}
    runs-on: windows-latest
    steps:
      - name: Require all applicable validation jobs to pass
        shell: pwsh
        env:
          DETECT_RESULT: ${{ needs.detect.result }}
          RELEASE_TEST_RESULT: ${{ needs.release_utility_tests.result }}
          COMPONENT_RESULT: ${{ needs.validate.result }}
          HAS_COMPONENTS: ${{ needs.detect.outputs.has_components }}
        run: |
          if ($env:DETECT_RESULT -ne "success") {
              throw "Changed-component detection did not succeed."
          }
          if ($env:RELEASE_TEST_RESULT -ne "success") {
              throw "Release utility tests did not succeed."
          }
          if ($env:HAS_COMPONENTS -eq "true" -and $env:COMPONENT_RESULT -ne "success") {
              throw "Affected component validation did not succeed."
          }
          if ($env:HAS_COMPONENTS -eq "false" -and $env:COMPONENT_RESULT -ne "skipped") {
              throw "Unexpected component validation state: $env:COMPONENT_RESULT"
          }
