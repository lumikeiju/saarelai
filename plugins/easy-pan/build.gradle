plugins {
    id 'java'
    id 'org.openstreetmap.josm' version '0.8.2'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

josm {
    pluginName = 'Easy Pan'
    josmCompileVersion = 19439
    manifest {
        description = 'Reduce repetitive input while mapping by panning JOSM from pointer displacement'
        mainClass = 'org.openstreetmap.josm.plugins.easypan.EasyPanPlugin'
        minJosmVersion = 19044
        minJavaVersion = 25
        iconPath = 'images/mapmode/easypan.png'
        author = 'Lumikeiju'
        canLoadAtRuntime = true
    }
}

// Keep the display name separate from the lower-kebab-case artifact paths.
def distributableJarName = 'easy-pan.jar'
def localDevelopmentJarName = 'easy-pan-dev.jar'

tasks.named('dist') {
    destinationDirectory.set(layout.buildDirectory.dir('plugin-dist-internal'))
}

tasks.register('assembleKebabDistJar', Copy) {
    dependsOn tasks.named('dist')
    from(tasks.named('dist').flatMap { it.archiveFile })
    into(layout.buildDirectory.dir('dist'))
    rename { distributableJarName }
}

tasks.named('assemble') {
    dependsOn tasks.named('assembleKebabDistJar')
}

tasks.named('localDistJar') {
    destinationDirectory.set(layout.buildDirectory.dir('plugin-local-dist-internal'))
}

tasks.named('localDist') {
    outputs.file(layout.buildDirectory.file("localDist/${localDevelopmentJarName}"))
    doLast {
        def sourceJar = tasks.named('localDistJar').get().archiveFile.get().asFile
        def targetJar = layout.buildDirectory.file("localDist/${localDevelopmentJarName}").get().asFile
        if (!sourceJar.isFile()) {
            throw new GradleException("Local-development JAR is missing: ${sourceJar}")
        }
        targetJar.parentFile.mkdirs()
        targetJar.bytes = sourceJar.bytes

        def listFile = layout.buildDirectory.file('localDist/list').get().asFile
        def listContents = listFile.getText('UTF-8')
        if (!listContents.contains("${sourceJar.name};")) {
            throw new GradleException("Local update-site list does not reference ${sourceJar.name}")
        }
        def previousLocalJar = layout.buildDirectory.file("localDist/${sourceJar.name}").get().asFile
        def updatedList = listContents
                .replace(sourceJar.toURI().toString(), targetJar.toURI().toString())
                .replace(sourceJar.absolutePath.replace('\\', '/'), targetJar.absolutePath.replace('\\', '/'))
                .replace(previousLocalJar.toURI().toString(), targetJar.toURI().toString())
                .replace(previousLocalJar.absolutePath.replace('\\', '/'), targetJar.absolutePath.replace('\\', '/'))
        if (!updatedList.contains("${sourceJar.name};${targetJar.toURI()}")) {
            throw new GradleException("Local update-site list does not point to ${targetJar}")
        }
        listFile.setText(updatedList, 'UTF-8')
    }
}

tasks.withType(JavaExec).configureEach {
    jvmArgs += [
        '--add-exports=java.base/sun.security.action=ALL-UNNAMED',
        '--add-exports=java.desktop/com.sun.imageio.plugins.jpeg=ALL-UNNAMED',
        '--add-exports=java.desktop/com.sun.imageio.spi=ALL-UNNAMED'
    ]
}

sourceSets {
    main {
        resources {
            srcDirs += projectDir
            include 'images/**'
        }
    }
}

repositories {
    mavenCentral()
}

test {
    useJUnitPlatform()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
